name: Akquise isolated checks (no deployment)
on:
  pull_request:
    paths: ['apps/akquise/**', '.github/workflows/akquise-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/akquise
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: akquise
          POSTGRES_PASSWORD: synthetic-ci-password-only
          POSTGRES_DB: akquise
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U akquise -d akquise"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://akquise:synthetic-ci-password-only@localhost:5432/akquise?schema=public
      APP_URL: http://localhost:3100
      ENABLE_EMAIL_SENDING: 'false'
      MAIL_MODE: disabled
      SMTP_CONFIGURATION_CONFIRMED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/akquise/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env
      - run: npm run db:generate
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Package and inspect standalone artifact
        run: node scripts/package-release.mjs
      - name: Browser dependencies and synthetic fixtures
        run: |
          npx playwright install --with-deps chromium
          npm run db:migrate
          ALLOW_SYNTHETIC_SEED=true npm run db:seed
      - name: Browser checks (no SMTP)
        run: |
          npm run dev > /tmp/akquise-dev.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS http://localhost:3100/api/health/ready >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Save synthetic concept previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-previews
          path: apps/akquise/.local/concept-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build production images (do not run or publish)
        run: |
          docker build --target runtime -t akquise-runtime-check .
          docker build --target operations -t akquise-operations-check .
      - name: Save synthetic graphics previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-previews
          path: |
            apps/akquise/.local/graphics-previews/
            apps/akquise/.local/hub-screenshots/studio*.png
          if-no-files-found: ignore
          retention-days: 7
