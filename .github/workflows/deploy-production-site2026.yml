# Production PRE-LIVE upload → studiojeker.ch/site2026 (Metanet/Plesk FTPS).
#
# SAFETY:
#   - Does NOT change Document Root / DNS / WordPress.
#   - Uploads ONLY into site2026 (parallel to wordpress).
#   - Refuses to touch studiojeker.ch/wordpress.
#   - Manual workflow_dispatch only — never on push, never automatic go-live.
#
# Required secrets:
#   METANET_PROD_FTP_SERVER
#   METANET_PROD_FTP_USERNAME
#   METANET_PROD_FTP_PASSWORD

name: Deploy production site2026 (pre-live)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type site2026 to confirm upload ONLY to studiojeker.ch/site2026 (never wordpress)"
        required: true
        type: string

concurrency:
  group: deploy-production-site2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-site2026:
    name: Build and upload to site2026 only
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Confirm site2026-only target
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM_TARGET}" != "site2026" ]; then
            echo "::error::Refusing deploy. Type exactly 'site2026' in confirm_target."
            exit 1
          fi
          echo "Confirmed: upload target is site2026 only (WordPress untouched)."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale main tip
        run: |
          set -euo pipefail
          git fetch origin main
          TIP="$(git rev-parse origin/main)"
          HEAD="$(git rev-parse HEAD)"
          echo "origin/main tip: ${TIP}"
          echo "Checked-out HEAD: ${HEAD}"
          if [ "${HEAD}" != "${TIP}" ]; then
            echo "::error::Refusing deploy. Checkout ${HEAD} is behind origin/main ${TIP}."
            exit 1
          fi

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.studiojeker.ch
          NEXT_PUBLIC_SANITY_PROJECT_ID: tgx6e6jg
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01

      - name: Verify out/ and production SEO guards
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/.htaccess
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/api/contact.php
          test -f out/api/homepage.php
          test -f out/api/contact-page.php
          test -f out/api/abo-page.php
          test -f out/api/work-page.php
          test -f out/api/service-page.php
          test -f out/api/about-page.php

          if grep -R --exclude='*.map' -l 'staging2026.studiojeker.ch' out \
            | grep -v 'out/api/homepage.php' ; then
            echo "::error::staging2026 URL found outside allowed comment context"
            exit 1
          fi

          # homepage.php may mention staging only in a comment — verify no HTML/XML SEO files have it
          if grep -R -n 'staging2026.studiojeker.ch' out --include='*.html' --include='*.xml' --include='*.txt' ; then
            echo "::error::staging2026 found in SEO-facing export files"
            exit 1
          fi

          grep -q 'Host: www.studiojeker.ch' out/robots.txt
          grep -q 'Allow: /' out/robots.txt
          grep -q 'https://www.studiojeker.ch' out/sitemap.xml
          if grep -q '/en/datenschutz' out/sitemap.xml; then
            echo "::error::sitemap must not include /en/datenschutz"
            exit 1
          fi
          echo "out/ verified ($(du -sh out | cut -f1))"

      - name: Install lftp
        run: |
          set -euo pipefail
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google.list \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google-chrome*.sources || true
          sudo rm -f /usr/share/keyrings/google-chrome*.gpg /etc/apt/keyrings/google-chrome*.gpg || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends lftp
          lftp --version | head -n 1

      - name: FTPS inspect structure, ensure site2026, upload out/
        env:
          METANET_PROD_FTP_SERVER: ${{ secrets.METANET_PROD_FTP_SERVER }}
          METANET_PROD_FTP_USERNAME: ${{ secrets.METANET_PROD_FTP_USERNAME }}
          METANET_PROD_FTP_PASSWORD: ${{ secrets.METANET_PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${METANET_PROD_FTP_SERVER}" ] || [ -z "${METANET_PROD_FTP_USERNAME}" ] || [ -z "${METANET_PROD_FTP_PASSWORD}" ]; then
            echo "::error::Missing METANET_PROD_FTP_* secrets."
            exit 1
          fi

          echo "FTP server configured: yes"
          echo "FTP username length: ${#METANET_PROD_FTP_USERNAME}"
          echo "FTP password length: ${#METANET_PROD_FTP_PASSWORD}"
          # Never echo secret values.

          lftp_common() {
            cat <<'LFTPSETTINGS'
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 120
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          LFTPSETTINGS
          }

          # List FTP login root (names only) to resolve base path.
          {
            lftp_common
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "echo ===== LOGIN PWD ====="
            echo "pwd"
            echo "echo ===== TOP LISTING ====="
            echo "cls -la"
            echo "cls -1 > /tmp/ftp-top-names.txt"
            echo "bye"
          } | lftp | tee /tmp/ftp-top-raw.txt

          echo "===== TOP NAMES ====="
          sed 's/\r$//' /tmp/ftp-top-names.txt | tee /tmp/ftp-top-names.clean.txt

          BASE=""
          if grep -qx 'wordpress' /tmp/ftp-top-names.clean.txt; then
            BASE="."
          elif grep -qx 'studiojeker.ch' /tmp/ftp-top-names.clean.txt; then
            BASE="studiojeker.ch"
          else
            echo "::error::Could not locate wordpress sibling at FTP login root. Refusing upload."
            exit 1
          fi
          echo "Resolved FTP base: ${BASE}"

          # List base and confirm wordpress exists as sibling of site2026.
          {
            lftp_common
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd ${BASE}"
            echo "echo ===== BASE PWD ====="
            echo "pwd"
            echo "echo ===== BASE LISTING ====="
            echo "cls -la"
            echo "cls -1 > /tmp/ftp-base-names.txt"
            echo "bye"
          } | lftp | tee /tmp/ftp-base-raw.txt

          sed 's/\r$//' /tmp/ftp-base-names.txt > /tmp/ftp-base-names.clean.txt
          echo "===== BASE NAMES ====="
          cat /tmp/ftp-base-names.clean.txt

          if ! grep -qx 'wordpress' /tmp/ftp-base-names.clean.txt; then
            echo "::error::wordpress directory not found at base — aborting (fail closed)."
            exit 1
          fi

          if ! grep -qx 'site2026' /tmp/ftp-base-names.clean.txt; then
            echo "Creating site2026 (WordPress untouched)..."
            {
              lftp_common
              echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
              echo "cd ${BASE}"
              echo "mkdir site2026"
              echo "bye"
            } | lftp
          else
            echo "site2026 already exists — uploading into it (no --delete)."
          fi

          TARGET_REL="${BASE}/site2026"
          case "${TARGET_REL}" in
            *wordpress*)
              echo "::error::Target path unexpectedly contains wordpress: ${TARGET_REL}"
              exit 1
              ;;
          esac
          echo "Upload target (relative): ${TARGET_REL}"

          # Mirror out/ → site2026 only. Never cd into wordpress. No --delete.
          {
            lftp_common
            echo "set mirror:parallel-transfer-count 1"
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd ${BASE}/site2026"
            echo "echo ===== SITE2026 PWD BEFORE UPLOAD ====="
            echo "pwd"
            echo "lcd out"
            echo "mirror -R --verbose --parallel=1 --exclude-glob api/contact.config.php ."
            echo "echo ===== VERIFY KEY FILES ====="
            echo "ls index.html"
            echo "ls .htaccess"
            echo "ls robots.txt"
            echo "ls sitemap.xml"
            echo "ls api/contact.php"
            echo "ls api/homepage.php"
            echo "ls api/contact-page.php"
            echo "ls api/abo-page.php"
            echo "ls api/work-page.php"
            echo "ls api/service-page.php"
            echo "ls api/about-page.php"
            echo "ls _next"
            echo "bye"
          } | lftp | tee /tmp/ftp-upload-log.txt

          echo "Upload to site2026 completed. WordPress was not targeted."

      - name: FTPS post-upload verification listing
        env:
          METANET_PROD_FTP_SERVER: ${{ secrets.METANET_PROD_FTP_SERVER }}
          METANET_PROD_FTP_USERNAME: ${{ secrets.METANET_PROD_FTP_USERNAME }}
          METANET_PROD_FTP_PASSWORD: ${{ secrets.METANET_PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          {
            cat <<'LFTPSETTINGS'
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 60
          set net:max-retries 3
          LFTPSETTINGS
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cls -1"
            echo "bye"
          } | lftp | tee /tmp/ftp-top2.txt

          if grep -qE '(^|[[:space:]])wordpress($|[[:space:]]|/)' /tmp/ftp-top2.txt; then
            BASE="."
          else
            BASE="studiojeker.ch"
          fi

          {
            cat <<'LFTPSETTINGS'
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 60
          set net:max-retries 3
          LFTPSETTINGS
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd ${BASE}"
            echo "echo ===== SIBLINGS (wordpress must still exist) ====="
            echo "cls -la"
            echo "cd site2026"
            echo "echo ===== site2026 TOP ====="
            echo "cls -la"
            echo "echo ===== site2026 api ====="
            echo "cls -la api"
            echo "echo ===== spot SEO files ====="
            echo "cat robots.txt"
            echo "bye"
          } | lftp | tee /tmp/ftp-verify.txt

          if ! grep -q 'wordpress' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: wordpress sibling no longer visible — investigate before any switch."
            exit 1
          fi
          if ! grep -q 'index.html' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: index.html missing in site2026"
            exit 1
          fi
          if ! grep -q 'Host: www.studiojeker.ch' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: robots.txt does not show production host"
            exit 1
          fi
          if grep -q 'staging2026.studiojeker.ch' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: staging host found in robots output"
            exit 1
          fi
          echo "Verification OK. Document Root was NOT changed."
