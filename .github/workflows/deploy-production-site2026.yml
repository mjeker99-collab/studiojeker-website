# Production LIVE upload → studiojeker.ch/site2026 (Metanet/Plesk FTPS).
#
# Evidence (2026-10-15) that the public site serves this folder:
#   - Actions run 36635984829 (2026-09-29) uploaded out/ → studiojeker.ch/site2026
#   - FTP listing: site2026/index.html size 76885 @ Sep 29 21:52
#   - Live https://www.studiojeker.ch/index.html: Content-Length 76885,
#     Last-Modified Tue, 29 Sep 2026 21:52:07 GMT (exact match)
#   - Live chunk hashes match that upload (e.g. 3794-e5ba39edb141d05c.js)
#   - URL paths /site2026/ and /wordpress/wp-login.php return 404 (DR is inside
#     the serving folder, not a URL alias)
#   - This workflow never changes Plesk Document Root; Metanet/Plesk did.
#
# Confirmed remote layout (FTP, 2026-09-29):
#   FTP login root/
#   └── studiojeker.ch/
#       ├── contao4.13/   ← never touch
#       ├── wordpress/    ← sibling; never touch
#       └── site2026/     ← upload target (public Document Root per fingerprint)
#
# Triggers:
#   A) push to main          — automatic live publish to studiojeker.ch/site2026
#   B) workflow_dispatch     — manual Actions run (confirm inputs required)
#
# SAFETY:
#   - Does NOT change Document Root / DNS / WordPress / contao4.13.
#   - Uploads ONLY into studiojeker.ch/site2026.
#   - Fail-closed unless studiojeker.ch/wordpress/ is present.
#   - Fail-closed unless live www index.html size matches remote site2026
#     (proves we are updating the folder that currently serves production).
#   - Before upload: remote rollback copy → site2026-rollback-<UTC>.
#   - Build + out/ guards run before any FTPS write.
#   - Staging workflow / METANET_FTP_* secrets are never used here.
#
# Required secrets:
#   METANET_PROD_FTP_SERVER
#   METANET_PROD_FTP_USERNAME
#   METANET_PROD_FTP_PASSWORD

name: Deploy production (Live)

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Manual only: type site2026 to confirm upload ONLY to studiojeker.ch/site2026 (never wordpress). Ignored on push to main."
        required: true
        type: string
      acknowledge_public_site:
        description: "Manual only: type www.studiojeker.ch. Ignored on push to main."
        required: true
        type: string

concurrency:
  group: deploy-production-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-live:
    name: Build and publish to studiojeker.ch (site2026)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Confirm trigger and live target
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          ACK_PUBLIC: ${{ inputs.acknowledge_public_site }}
        run: |
          set -euo pipefail

          echo "Event: ${EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"

          case "${EVENT_NAME}" in
            push)
              echo "Push to main — deploying live studiojeker.ch/site2026"
              echo "confirm_target / acknowledge_public_site not required for push."
              ;;
            workflow_dispatch)
              if [ "${CONFIRM_TARGET}" != "site2026" ]; then
                echo "::error::Refusing deploy. Type exactly 'site2026' in confirm_target."
                exit 1
              fi
              if [ "${ACK_PUBLIC}" != "www.studiojeker.ch" ]; then
                echo "::error::Refusing deploy. Type exactly 'www.studiojeker.ch' in acknowledge_public_site."
                echo "Evidence shows studiojeker.ch/site2026 currently serves the public site."
                exit 1
              fi
              echo "Confirmed manual live deploy: studiojeker.ch/site2026 (WordPress untouched)."
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale main tip
        run: |
          set -euo pipefail
          git fetch origin main
          TIP="$(git rev-parse origin/main)"
          HEAD="$(git rev-parse HEAD)"
          echo "origin/main tip: ${TIP}"
          echo "Checked-out HEAD: ${HEAD}"
          if [ "${HEAD}" != "${TIP}" ]; then
            echo "::error::Refusing deploy. Checkout ${HEAD} is behind origin/main ${TIP}."
            exit 1
          fi

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.studiojeker.ch
          NEXT_PUBLIC_SANITY_PROJECT_ID: tgx6e6jg
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01

      - name: Verify out/ and production SEO guards
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/.htaccess
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/work/index.html
          test -f out/api/contact.php
          test -f out/api/homepage.php
          test -f out/api/contact-page.php
          test -f out/api/abo-page.php
          test -f out/api/work-page.php
          test -f out/api/service-page.php
          test -f out/api/about-page.php

          if grep -R --exclude='*.map' -l 'staging2026.studiojeker.ch' out \
            | grep -v 'out/api/homepage.php' ; then
            echo "::error::staging2026 URL found outside allowed comment context"
            exit 1
          fi

          # homepage.php may mention staging only in a comment — verify no HTML/XML SEO files have it
          if grep -R -n 'staging2026.studiojeker.ch' out --include='*.html' --include='*.xml' --include='*.txt' ; then
            echo "::error::staging2026 found in SEO-facing export files"
            exit 1
          fi

          grep -q 'Host: www.studiojeker.ch' out/robots.txt
          grep -q 'Allow: /' out/robots.txt
          grep -q 'https://www.studiojeker.ch' out/sitemap.xml
          if grep -q '/en/datenschutz' out/sitemap.xml; then
            echo "::error::sitemap must not include /en/datenschutz"
            exit 1
          fi

          # Work hero: proxy must project image; export should bake Sanity hero when published
          if ! grep -q 'image{$imageProjection}' out/api/work-page.php; then
            echo "::error::out/api/work-page.php missing heroSection.image projection"
            exit 1
          fi
          node scripts/verify-work-hero-export.mjs
          echo "out/ verified ($(du -sh out | cut -f1))"

      - name: Install lftp
        run: |
          set -euo pipefail
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google.list \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google-chrome*.sources || true
          sudo rm -f /usr/share/keyrings/google-chrome*.gpg /etc/apt/keyrings/google-chrome*.gpg || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends lftp
          lftp --version | head -n 1

      - name: FTPS inspect, live fingerprint, rollback copy, upload out/
        env:
          METANET_PROD_FTP_SERVER: ${{ secrets.METANET_PROD_FTP_SERVER }}
          METANET_PROD_FTP_USERNAME: ${{ secrets.METANET_PROD_FTP_USERNAME }}
          METANET_PROD_FTP_PASSWORD: ${{ secrets.METANET_PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${METANET_PROD_FTP_SERVER}" ] || [ -z "${METANET_PROD_FTP_USERNAME}" ] || [ -z "${METANET_PROD_FTP_PASSWORD}" ]; then
            echo "::error::Missing METANET_PROD_FTP_* secrets."
            exit 1
          fi

          echo "FTP server configured: yes"
          echo "FTP username length: ${#METANET_PROD_FTP_USERNAME}"
          echo "FTP password length: ${#METANET_PROD_FTP_PASSWORD}"
          # Never echo secret values.

          lftp_common() {
            cat <<'LFTPSETTINGS'
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 120
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          LFTPSETTINGS
          }

          {
            lftp_common
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "echo ===== LOGIN PWD ====="
            echo "pwd"
            echo "echo ===== TOP LISTING ====="
            echo "cls -la"
            echo "cls -1 > /tmp/ftp-top-names.txt"
            echo "bye"
          } | lftp | tee /tmp/ftp-top-raw.txt

          echo "===== TOP NAMES ====="
          sed 's/\r$//; s#/$##' /tmp/ftp-top-names.txt | tee /tmp/ftp-top-names.clean.txt

          if ! grep -qx 'studiojeker.ch' /tmp/ftp-top-names.clean.txt; then
            echo "::error::FTP login root must contain studiojeker.ch/. Refusing upload (fail closed)."
            exit 1
          fi

          BASE="studiojeker.ch"
          echo "Resolved FTP base: ${BASE}"

          {
            lftp_common
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd ${BASE}"
            echo "echo ===== BASE PWD ====="
            echo "pwd"
            echo "echo ===== BASE LISTING ====="
            echo "cls -la"
            echo "cls -1 > /tmp/ftp-base-names.txt"
            echo "bye"
          } | lftp | tee /tmp/ftp-base-raw.txt

          sed 's/\r$//; s#/$##' /tmp/ftp-base-names.txt > /tmp/ftp-base-names.clean.txt
          echo "===== BASE NAMES ====="
          cat /tmp/ftp-base-names.clean.txt

          if ! grep -qx 'wordpress' /tmp/ftp-base-names.clean.txt; then
            echo "::error::studiojeker.ch/wordpress/ not found — aborting (fail closed). WordPress must remain as sibling of site2026."
            exit 1
          fi

          if ! grep -qx 'site2026' /tmp/ftp-base-names.clean.txt; then
            echo "::error::studiojeker.ch/site2026 missing — refusing to create it on a live-fingerprint deploy. Investigate Document Root first."
            exit 1
          fi

          TARGET_REL="${BASE}/site2026"
          if [ "${TARGET_REL}" != "studiojeker.ch/site2026" ]; then
            echo "::error::Refusing unexpected upload target: ${TARGET_REL}"
            exit 1
          fi
          case "${TARGET_REL}" in
            *wordpress*)
              echo "::error::Target path unexpectedly contains wordpress: ${TARGET_REL}"
              exit 1
              ;;
          esac
          echo "Upload target (relative): ${TARGET_REL}"

          # --- Live fingerprint: remote site2026/index.html must match public www ---
          mkdir -p /tmp/ftp-fingerprint
          {
            lftp_common
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd studiojeker.ch/site2026"
            echo "get index.html -o /tmp/ftp-fingerprint/remote-index.html"
            echo "get api/work-page.php -o /tmp/ftp-fingerprint/remote-work-page.php"
            echo "bye"
          } | lftp | tee /tmp/ftp-fingerprint-get.txt

          test -f /tmp/ftp-fingerprint/remote-index.html
          REMOTE_SIZE="$(wc -c < /tmp/ftp-fingerprint/remote-index.html | tr -d ' ')"
          echo "Remote site2026/index.html size: ${REMOTE_SIZE}"

          LIVE_HEADERS="$(mktemp)"
          curl -sS -D "${LIVE_HEADERS}" -o /tmp/ftp-fingerprint/live-index.html \
            "https://www.studiojeker.ch/index.html"
          LIVE_SIZE="$(wc -c < /tmp/ftp-fingerprint/live-index.html | tr -d ' ')"
          LIVE_LM="$(awk 'tolower($1)=="last-modified:" {sub(/\r$/,""); print substr($0,16)}' "${LIVE_HEADERS}" | head -n1)"
          echo "Live www index.html size: ${LIVE_SIZE}"
          echo "Live www Last-Modified: ${LIVE_LM}"

          if [ "${REMOTE_SIZE}" != "${LIVE_SIZE}" ]; then
            echo "::error::Live fingerprint mismatch. Remote site2026/index.html (${REMOTE_SIZE} B) ≠ www.studiojeker.ch/index.html (${LIVE_SIZE} B)."
            echo "Refusing upload — Document Root may no longer point at site2026. Confirm in Plesk before any production write."
            exit 1
          fi
          if ! cmp -s /tmp/ftp-fingerprint/remote-index.html /tmp/ftp-fingerprint/live-index.html; then
            echo "::error::Live fingerprint byte mismatch between remote site2026/index.html and www.studiojeker.ch/index.html."
            echo "Refusing upload — investigate Document Root / CDN before any production write."
            exit 1
          fi
          echo "Live fingerprint OK: www.studiojeker.ch serves studiojeker.ch/site2026."

          # --- Rollback copy (remote↔remote) before overwrite ---
          ROLLBACK_NAME="site2026-rollback-$(date -u +%Y%m%d%H%M%S)"
          echo "Creating rollback folder studiojeker.ch/${ROLLBACK_NAME} (copy of site2026)..."
          {
            lftp_common
            echo "set mirror:parallel-transfer-count 1"
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd studiojeker.ch"
            echo "mkdir ${ROLLBACK_NAME}"
            echo "mirror --verbose --parallel=1 site2026 ${ROLLBACK_NAME}"
            echo "cls -1 > /tmp/ftp-after-rollback-names.txt"
            echo "bye"
          } | lftp | tee /tmp/ftp-rollback-log.txt

          sed 's/\r$//; s#/$##' /tmp/ftp-after-rollback-names.txt > /tmp/ftp-after-rollback-names.clean.txt
          if ! grep -qx "${ROLLBACK_NAME}" /tmp/ftp-after-rollback-names.clean.txt; then
            echo "::error::Rollback folder ${ROLLBACK_NAME} was not created. Refusing upload."
            exit 1
          fi
          if ! grep -qx 'wordpress' /tmp/ftp-after-rollback-names.clean.txt; then
            echo "::error::wordpress missing after rollback copy — aborting."
            exit 1
          fi
          echo "ROLLBACK_DIR=${ROLLBACK_NAME}" >> "${GITHUB_ENV}"
          echo "Rollback ready: studiojeker.ch/${ROLLBACK_NAME}"

          # Mirror out/ → studiojeker.ch/site2026 only. Never cd into wordpress. No --delete.
          {
            lftp_common
            echo "set mirror:parallel-transfer-count 1"
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd studiojeker.ch/site2026"
            echo "echo ===== SITE2026 PWD BEFORE UPLOAD ====="
            echo "pwd"
            echo "lcd out"
            echo "mirror -R --verbose --parallel=1 --exclude-glob api/contact.config.php ."
            echo "echo ===== VERIFY KEY FILES ====="
            echo "ls index.html"
            echo "ls .htaccess"
            echo "ls robots.txt"
            echo "ls sitemap.xml"
            echo "ls api/contact.php"
            echo "ls api/homepage.php"
            echo "ls api/contact-page.php"
            echo "ls api/abo-page.php"
            echo "ls api/work-page.php"
            echo "ls api/service-page.php"
            echo "ls api/about-page.php"
            echo "ls _next"
            echo "ls work/index.html"
            echo "bye"
          } | lftp | tee /tmp/ftp-upload-log.txt

          echo "Upload to studiojeker.ch/site2026 completed. WordPress was not targeted."
          echo "Rollback folder: studiojeker.ch/${ROLLBACK_NAME}"

      - name: FTPS post-upload verification listing
        env:
          METANET_PROD_FTP_SERVER: ${{ secrets.METANET_PROD_FTP_SERVER }}
          METANET_PROD_FTP_USERNAME: ${{ secrets.METANET_PROD_FTP_USERNAME }}
          METANET_PROD_FTP_PASSWORD: ${{ secrets.METANET_PROD_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          {
            cat <<'LFTPSETTINGS'
          set cmd:fail-exit true
          set ssl:verify-certificate true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 60
          set net:max-retries 3
          LFTPSETTINGS
            echo "open -u \"$METANET_PROD_FTP_USERNAME\",\"$METANET_PROD_FTP_PASSWORD\" \"ftp://$METANET_PROD_FTP_SERVER:21\""
            echo "cd studiojeker.ch"
            echo "echo ===== SIBLINGS (wordpress must still exist) ====="
            echo "cls -la"
            echo "cls -1 > /tmp/ftp-siblings.txt"
            echo "cd site2026"
            echo "echo ===== site2026 TOP ====="
            echo "cls -la"
            echo "echo ===== site2026 api ====="
            echo "cls -la api"
            echo "echo ===== spot SEO files ====="
            echo "cat robots.txt"
            echo "get api/work-page.php -o /tmp/ftp-post-work-page.php"
            echo "bye"
          } | lftp | tee /tmp/ftp-verify.txt

          sed 's/\r$//; s#/$##' /tmp/ftp-siblings.txt > /tmp/ftp-siblings.clean.txt
          if ! grep -qx 'wordpress' /tmp/ftp-siblings.clean.txt; then
            echo "::error::Post-check: studiojeker.ch/wordpress/ no longer visible — investigate before any switch."
            exit 1
          fi
          if ! grep -q 'index.html' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: index.html missing in site2026"
            exit 1
          fi
          if ! grep -q 'Host: www.studiojeker.ch' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: robots.txt does not show production host"
            exit 1
          fi
          if grep -q 'staging2026.studiojeker.ch' /tmp/ftp-verify.txt; then
            echo "::error::Post-check: staging host found in robots output"
            exit 1
          fi
          if ! grep -q 'image{$imageProjection}' /tmp/ftp-post-work-page.php; then
            echo "::error::Post-check: remote api/work-page.php missing hero image projection"
            exit 1
          fi
          echo "Verification OK. Document Root was NOT changed by this workflow."
          if [ -n "${ROLLBACK_DIR:-}" ]; then
            echo "Rollback available at: studiojeker.ch/${ROLLBACK_DIR}"
          fi

      - name: Public www smoke — Work hero proxy + HTML freshness
        run: |
          set -euo pipefail
          # Allow brief Apache/CDN settle
          sleep 5

          curl -sS -D /tmp/live-work.headers -o /tmp/live-work.html \
            "https://www.studiojeker.ch/work/"
          curl -sS -D /tmp/live-api.headers -o /tmp/live-api.json \
            "https://www.studiojeker.ch/api/work-page.php"

          LM="$(awk 'tolower($1)=="last-modified:" {sub(/\r$/,""); print substr($0,16)}' /tmp/live-work.headers | head -n1 || true)"
          echo "Live /work/ Last-Modified: ${LM}"

          # Proxy must now expose heroSection.image (new PHP) when Sanity has one
          python3 <<'PY'
          import json, sys
          doc = json.load(open("/tmp/live-api.json"))
          if not doc.get("ok"):
              print("::error::work-page.php did not return ok:true", file=sys.stderr)
              sys.exit(1)
          hero = (doc.get("document") or {}).get("heroSection") or {}
          image = hero.get("image")
          if not isinstance(image, dict) or not image.get("asset"):
              print("::error::Live proxy heroSection.image missing after deploy", file=sys.stderr)
              print(json.dumps(hero, indent=2)[:800], file=sys.stderr)
              sys.exit(1)
          url = (image.get("asset") or {}).get("url") or ""
          print("Live proxy hero image URL:", url[:120])
          if "cdn.sanity.io" not in url:
              print("::error::Unexpected hero asset URL", file=sys.stderr)
              sys.exit(1)
          PY

          # HTML should no longer be the 2026-09-29 build (Last-Modified must change)
          if grep -qi '29 Sep 2026 21:52' /tmp/live-work.headers; then
            echo "::warning::Last-Modified still shows 29 Sep 2026 21:52 — cache may be sticky; recheck manually."
          fi

          # Frontend must include HeroMedia / split-hero markers from current WorkPage
          if ! grep -qE 'HeroMedia|heroMedia|WorkPage_hero' /tmp/live-work.html; then
            echo "::warning::Could not find hero CSS markers in HTML (may be hashed differently). Proxy check passed."
          fi

          {
            echo "## Deploy production (Live)"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Target: \`studiojeker.ch/site2026\` (live fingerprint matched www before upload)"
            echo "- Rollback: \`studiojeker.ch/${ROLLBACK_DIR:-unknown}\`"
            echo "- WordPress / Document Root setting: **not** changed by this workflow"
            echo "- Staging / \`METANET_FTP_*\`: **not** used"
            echo "- Live proxy: heroSection.image present"
            echo "- Live /work/ Last-Modified: ${LM:-unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"
