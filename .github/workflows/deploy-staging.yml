# Staging deploy → staging2026.studiojeker.ch (Metanet/Plesk FTPS).
# Does NOT deploy to production / studiojeker.ch.
#
# Triggers:
#   A) push to main          — code changes rebuild + deploy staging
#   B) workflow_dispatch     — manual Actions run (requires confirm_target)
#   C) repository_dispatch   — Sanity CMS publish webhooks
#
# Architecture (static export on Apache):
#   - Build bakes published Sanity into HTML (useCdn: false).
#   - Same-origin PHP proxies (/api/*-page.php) refresh CMS content in the
#     browser without waiting for a redeploy.
#   - Webhooks rebuild baked HTML / SEO so first paint stays current.
#
# Critical guard:
#   Refuse FTPS upload when this run's commit is behind origin/main.
#   Prevents stale re-runs / queued older pushes from overwriting a newer deploy
#   (observed 2026-09-09: run attempt of #63 @ 1ceaf3f overwrote #66 @ 631b6b1).

name: Deploy staging (Metanet)

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type staging2026 to confirm this deploys ONLY to staging"
        required: true
        type: string

  # Sanity → GitHub repository_dispatch (configure webhooks in Sanity Manage).
  repository_dispatch:
    types:
      - sanity-homepage-published
      - sanity-abo-published
      - sanity-contact-published
      - sanity-work-published
      - sanity-service-published
      - sanity-cms-published

# Keep cancel-in-progress false so an in-flight FTPS mirror is not interrupted
# mid-upload (partial tree). Stale runs are blocked by the tip-of-main guard.
concurrency:
  group: deploy-staging-metanet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build static export and deploy to staging FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirm trigger and staging-only target
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          DISPATCH_TYPE: ${{ github.event.action }}
          CLIENT_DOCUMENT_TYPE: ${{ github.event.client_payload.documentType }}
        run: |
          set -euo pipefail

          echo "Event: ${EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"

          case "${EVENT_NAME}" in
            workflow_dispatch)
              if [ "${CONFIRM_TARGET}" != "staging2026" ]; then
                echo "::error::Refusing deploy. Type exactly 'staging2026' in confirm_target."
                exit 1
              fi
              echo "Confirmed manual staging deploy: staging2026.studiojeker.ch"
              ;;
            push)
              echo "Push to main — deploying staging2026.studiojeker.ch"
              ;;
            repository_dispatch)
              case "${DISPATCH_TYPE}" in
                sanity-homepage-published|sanity-abo-published|sanity-contact-published|sanity-work-published|sanity-service-published|sanity-cms-published) ;;
                *)
                  echo "::error::Unexpected repository_dispatch type: ${DISPATCH_TYPE}"
                  exit 1
                  ;;
              esac
              if [ -n "${CLIENT_DOCUMENT_TYPE}" ]; then
                case "${CLIENT_DOCUMENT_TYPE}" in
                  homepage|abo|contact|work|service|client|project|cms) ;;
                  *)
                    echo "::error::Refusing deploy. Unsupported client_payload.documentType '${CLIENT_DOCUMENT_TYPE}'."
                    exit 1
                    ;;
                esac
              fi
              echo "Sanity CMS publish — deploying staging2026.studiojeker.ch"
              echo "Dispatch type: ${DISPATCH_TYPE}"
              if [ -n "${CLIENT_DOCUMENT_TYPE}" ]; then
                echo "Document type: ${CLIENT_DOCUMENT_TYPE}"
              fi
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

      # CMS webhooks always build tip of main. Push/dispatch re-runs of old SHAs
      # are rejected after fetch so they cannot FTPS-overwrite a newer staging.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Refuse stale / superseded deploys
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          TIP="$(git rev-parse origin/main)"
          HEAD="$(git rev-parse HEAD)"
          echo "origin/main tip: ${TIP}"
          echo "Checked-out HEAD: ${HEAD}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"

          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [ "${HEAD}" != "${TIP}" ]; then
              echo "Resetting to origin/main tip for CMS rebuild"
              git checkout --force "${TIP}"
            fi
            echo "CMS webhook deploy will build ${TIP}"
            exit 0
          fi

          if [ "${HEAD}" != "${TIP}" ] || [ "${GITHUB_SHA}" != "${TIP}" ]; then
            echo "::error::Refusing stale deploy."
            echo "This run would build ${GITHUB_SHA}, but origin/main is ${TIP}."
            echo "A newer commit already exists — allowing this FTPS upload would overwrite staging with older code/content."
            echo "Re-run Deploy staging on the latest main commit instead of re-running an old workflow."
            exit 1
          fi

          echo "Deploy SHA matches origin/main tip — safe to continue."

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — compatible with Next.js 16 in this repo
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Staging public URL for canonicals / metadata in the exported HTML
          NEXT_PUBLIC_SITE_URL: https://staging2026.studiojeker.ch
          # Public Sanity identifiers (defaults also exist in lib/sanity/env.ts)
          NEXT_PUBLIC_SANITY_PROJECT_ID: tgx6e6jg
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01

      - name: Verify out/ exists
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Static export directory out/ is missing after build."
            exit 1
          fi
          if [ ! -f "out/index.html" ]; then
            echo "::error::out/index.html is missing — refusing to deploy an incomplete export."
            exit 1
          fi
          if [ ! -f "out/api/contact.php" ]; then
            echo "::error::out/api/contact.php is missing — contact endpoint must be present."
            exit 1
          fi
          if [ ! -f "out/api/homepage.php" ]; then
            echo "::error::out/api/homepage.php is missing — Homepage live proxy must be present."
            exit 1
          fi
          if [ ! -f "out/api/contact-page.php" ]; then
            echo "::error::out/api/contact-page.php is missing — Contact live proxy must be present."
            exit 1
          fi
          if [ ! -f "out/api/service-page.php" ]; then
            echo "::error::out/api/service-page.php is missing — Service live proxy must be present."
            exit 1
          fi
          if [ ! -f "out/api/work-page.php" ]; then
            echo "::error::out/api/work-page.php is missing — Work live proxy must be present."
            exit 1
          fi
          if [ ! -f "out/api/abo-page.php" ]; then
            echo "::error::out/api/abo-page.php is missing — Content Abo live proxy must be present."
            exit 1
          fi
          # Hidden files from public/ (e.g. .htaccess) must be present in the export.
          if [ ! -f "out/.htaccess" ]; then
            echo "::error::out/.htaccess is missing — Apache rules must be uploaded to staging."
            exit 1
          fi
          echo "out/ verified ($(du -sh out | cut -f1))"
          echo "Hidden export files:"
          find out -maxdepth 2 -name '.*' -type f | sort
          ls -la out | head -40

      - name: Re-check tip of main before FTPS
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          TIP="$(git rev-parse origin/main)"
          HEAD="$(git rev-parse HEAD)"
          if [ "${EVENT_NAME}" != "repository_dispatch" ] && [ "${HEAD}" != "${TIP}" ]; then
            echo "::error::main moved to ${TIP} during this build (was ${HEAD}). Aborting FTPS to avoid overwriting a newer deploy."
            exit 1
          fi
          echo "Pre-FTPS tip check OK (${HEAD})"

      - name: Deploy contents of out/ to staging FTPS (lftp)
        env:
          METANET_FTP_SERVER: ${{ secrets.METANET_FTP_SERVER }}
          METANET_FTP_USERNAME: ${{ secrets.METANET_FTP_USERNAME }}
          METANET_FTP_PASSWORD: ${{ secrets.METANET_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # ubuntu-latest images include Google Chrome apt sources that are unrelated
          # to this deploy. Occasional Hash Sum mismatch on dl.google.com aborts
          # `apt-get update` (exit 100) before lftp can be installed. Remove those
          # sources so only Ubuntu/Microsoft mirrors are used for this job.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google.list \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google-chrome*.sources
          # Drop any leftover chrome signed-by keyring entries that apt still probes.
          sudo rm -f /usr/share/keyrings/google-chrome*.gpg /etc/apt/keyrings/google-chrome*.gpg || true

          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends lftp
          command -v lftp
          lftp --version | head -n 1

          # Explicit FTPS (AUTH TLS on port 21), passive data channel, strict TLS.
          # mirror -R uploads out/ contents only — no --delete (server-side extras preserved).
          lftp -e "
            set cmd:fail-exit true;
            set ssl:verify-certificate true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            open -u ${METANET_FTP_USERNAME},${METANET_FTP_PASSWORD} ftp://${METANET_FTP_SERVER}:21;
            lcd out;
            mirror -R --verbose --parallel=1 --exclude-glob api/contact.config.php .;
            bye
          "
