# Manual staging deploy only — never runs on push/PR/schedule.
# Target: staging2026.studiojeker.ch (Metanet/Plesk FTP).
# Does NOT deploy to production / studiojeker.ch.

name: Deploy staging (Metanet)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type staging2026 to confirm this deploys ONLY to staging"
        required: true
        type: string

concurrency:
  group: deploy-staging-metanet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build static export and deploy to staging FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirm staging-only target
        run: |
          if [ "${{ inputs.confirm_target }}" != "staging2026" ]; then
            echo "::error::Refusing deploy. Type exactly 'staging2026' in confirm_target."
            exit 1
          fi
          echo "Confirmed staging target: staging2026.studiojeker.ch"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — compatible with Next.js 16 in this repo
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Staging public URL for canonicals / metadata in the exported HTML
          NEXT_PUBLIC_SITE_URL: https://staging2026.studiojeker.ch

      - name: Verify out/ exists
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Static export directory out/ is missing after build."
            exit 1
          fi
          if [ ! -f "out/index.html" ]; then
            echo "::error::out/index.html is missing — refusing to deploy an incomplete export."
            exit 1
          fi
          if [ ! -f "out/api/contact.php" ]; then
            echo "::error::out/api/contact.php is missing — contact endpoint must be present."
            exit 1
          fi
          # Hidden files from public/ (e.g. .htaccess) must be present in the export.
          if [ ! -f "out/.htaccess" ]; then
            echo "::error::out/.htaccess is missing — Apache rules must be uploaded to staging."
            exit 1
          fi
          echo "out/ verified ($(du -sh out | cut -f1))"
          echo "Hidden export files:"
          find out -maxdepth 2 -name '.*' -type f | sort
          ls -la out | head -40

      - name: Deploy contents of out/ to staging FTPS (lftp)
        env:
          METANET_FTP_SERVER: ${{ secrets.METANET_FTP_SERVER }}
          METANET_FTP_USERNAME: ${{ secrets.METANET_FTP_USERNAME }}
          METANET_FTP_PASSWORD: ${{ secrets.METANET_FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          # Explicit FTPS (AUTH TLS on port 21), passive data channel, strict TLS.
          # mirror -R uploads out/ contents only — no --delete (server-side extras preserved).
          lftp -e "
            set cmd:fail-exit true;
            set ssl:verify-certificate true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            open -u ${METANET_FTP_USERNAME},${METANET_FTP_PASSWORD} ftp://${METANET_FTP_SERVER}:21;
            lcd out;
            mirror -R --verbose --parallel=1 --exclude-glob api/contact.config.php .;
            bye
          "
