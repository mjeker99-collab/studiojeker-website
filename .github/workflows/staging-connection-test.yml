name: Staging FTP Connection Test

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Test FTPS connection
        env:
          FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          FTP_USER: ${{ secrets.STAGING_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -e

          echo "Testing staging FTPS..."
          echo "Host configured: yes"
          echo "Username length: ${#FTP_USER}"
          echo "Password length: ${#FTP_PASSWORD}"

          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set ssl:verify-certificate true
          set net:timeout 30
          set net:max-retries 1

          open -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21"

          echo ===== CURRENT DIRECTORY =====
          pwd

          echo ===== STAGING CONTENT =====
          cls -la

          bye
          EOF

          echo "FTPS LOGIN SUCCESSFUL"
