name: StudioONE Express – safe PR auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feat/akquise-production-readiness]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  enable-auto-merge:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (required checks and branch protection remain enforced)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
