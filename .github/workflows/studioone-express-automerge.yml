name: StudioONE Express – checked PR auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feat/akquise-production-readiness]
permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch is the exception that GITHUB_TOKEN may start.
  # The squash merge itself does not trigger the push workflow.
  actions: write
jobs:
  enable-auto-merge:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test the auto-merge gate
        run: node --test .github/scripts/studioone-express-automerge.test.mjs
      - name: Merge only after CI and start checks on the squash commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash .github/scripts/studioone-express-automerge.sh
