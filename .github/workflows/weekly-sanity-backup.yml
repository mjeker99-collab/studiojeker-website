name: Weekly Sanity content backup

on:
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check backup credentials
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::Missing SANITY_AUTH_TOKEN GitHub Actions repository secret"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install Sanity CLI
        working-directory: studio
        run: npm ci
      - name: Export dataset including media assets
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          mkdir -p ../backups
          npx sanity dataset export production "../backups/studiojeker-sanity-${GITHUB_RUN_ID}.tar.gz" --overwrite
          test -s "../backups/studiojeker-sanity-${GITHUB_RUN_ID}.tar.gz"
      - name: Upload to private Exoscale backup bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EXOSCALE_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EXOSCALE_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ch-dk-2
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing Exoscale access key"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing Exoscale secret key"; exit 1; }
          F="backups/studiojeker-sanity-${GITHUB_RUN_ID}.tar.gz"
          aws --endpoint-url https://sos-ch-dk-2.exo.io s3 cp "$F" "s3://studiojeker-backups/website/sanity/$(date -u +%Y-%m-%d)/studiojeker-sanity-${GITHUB_RUN_ID}.tar.gz"
      - name: Store weekly backup (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: studiojeker-sanity-${{ github.run_id }}
          path: backups/*.tar.gz
          retention-days: 90
          if-no-files-found: error
