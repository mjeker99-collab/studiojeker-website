name: Weekly StudioONE PostgreSQL backup to Exoscale
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check credentials
        env:
          DATABASE_URL: ${{ secrets.STUDIOONE_BACKUP_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.EXOSCALE_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EXOSCALE_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Set STUDIOONE_BACKUP_DATABASE_URL"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Set EXOSCALE_BACKUP_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Set EXOSCALE_BACKUP_SECRET_ACCESS_KEY"; exit 1; }
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: Export StudioONE production database
        env:
          DATABASE_URL: ${{ secrets.STUDIOONE_BACKUP_DATABASE_URL }}
        run: |
          mkdir -p backups
          pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file="backups/studioone-${GITHUB_RUN_ID}.dump"
          test -s "backups/studioone-${GITHUB_RUN_ID}.dump"
          # pg_restore validates the custom archive directory without restoring data.
          pg_restore --list "backups/studioone-${GITHUB_RUN_ID}.dump" > /dev/null
      - name: Upload via TLS to Exoscale private bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EXOSCALE_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EXOSCALE_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ch-dk-2
        run: |
          set -euo pipefail
          file="backups/studioone-${GITHUB_RUN_ID}.dump"
          key="studioone/postgres/$(date -u +%Y-%m-%d)/studioone-${GITHUB_RUN_ID}.dump"
          aws --endpoint-url https://sos-ch-dk-2.exo.io s3 cp "$file" "s3://studiojeker-backups/$key"
          expected=$(stat -c %s "$file")
          actual=$(aws --endpoint-url https://sos-ch-dk-2.exo.io s3api head-object \
            --bucket studiojeker-backups --key "$key" --query ContentLength --output text)
          test "$actual" = "$expected" || {
            echo "::error::PostgreSQL backup was not verified in Exoscale; size mismatch."
            exit 1
          }
          echo "PostgreSQL custom archive validated and private offsite object size verified."
