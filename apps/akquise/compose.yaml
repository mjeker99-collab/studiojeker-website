services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akquise
      POSTGRES_USER: akquise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - akquise-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akquise']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  akquise-data:
