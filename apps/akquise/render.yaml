# Custom Blueprint path: apps/akquise/render.yaml. Applying creates paid resources!
# Stacked on PR #140, which depends on #133. Never apply from main before both merge.
previews:
  generation: "off"
services:
  - type: web
    name: studiojeker-akquise
    runtime: node
    region: frankfurt
    plan: 1c-2g
    numInstances: 1
    rootDir: apps/akquise
    autoDeployTrigger: "off"
    buildCommand: node render/build.mjs
    preDeployCommand: node render/command.mjs migrate
    startCommand: node render/command.mjs start
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studiojeker-akquise-db
          property: connectionString
      - key: MARTIN_EMAIL
        sync: false
      - key: NORA_EMAIL
        sync: false
      - key: MAIL_MODE
        value: disabled
      - key: ENABLE_EMAIL_SENDING
        value: "false"
      - key: SMTP_CONFIGURATION_CONFIRMED
        value: "false"
      - key: SMTP_HOST
        value: jovinus.metanet.ch
      - key: SMTP_USER
        value: njeker@studiojeker.ch
      - key: MAIL_FROM
        value: njeker@studiojeker.ch
      - key: DAILY_SEND_LIMIT
        value: "20"
databases:
  - name: studiojeker-akquise-db
    region: frankfurt
    plan: 0.5c-1g
    postgresMajorVersion: "18"
    databaseName: akquise
    user: akquise
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
