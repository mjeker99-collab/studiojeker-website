<script>
const KEY='studioone-v2-review-1';const initial={page:'home',tab:'contacts',step:1,selected:[1,2,3,4],subject:'Mehr Sichtbarkeit für Ihr Unternehmen',body:'Guten Tag\n\nWie bleibt Ihr Unternehmen im Alltag Ihrer Kunden präsent? Wir unterstützen Sie mit regelmässigen Inhalten für LinkedIn, Instagram und Facebook.\n\nGerne zeigen wir Ihnen in einem kurzen Gespräch, wie das für Ihr Unternehmen aussehen könnte.\n\nBeste Grüsse',contentTitle:'Sichtbarkeit, die bleibt.',contentText:'Regelmässig präsent sein. Mit Inhalten, die zu Ihrem Unternehmen passen.',contentType:'Newsletter',task:'',planned:false};let state={...initial};let persistent=true;try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.schema===1)state={...initial,...s.data}}catch{persistent=false}const names=[['home','Übersicht','⌂'],['acquisition','Akquise','↗'],['content','Inhalte','▤'],['projects','Projekte','▦'],['library','Bibliothek','▧'],['calendar','Kalender','□']];const contacts=[{id:1,name:'Anna Beispiel',firm:'Demo Maschinenbau',industry:'Industrie',ok:true},{id:2,name:'Lukas Muster',firm:'Demo Architektur',industry:'Architektur',ok:true},{id:3,name:'Mia Beispiel',firm:'Demo Dienstleistungen',industry:'Dienstleistung',ok:true},{id:4,name:'Jan Muster',firm:'Demo Technik',industry:'Industrie',ok:false}];let previousContent=null;let toastTimer;let consent=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const selected=()=>contacts.filter(c=>state.selected.includes(c.id));const ready=()=>selected().filter(c=>c.ok);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({schema:1,data:state}))}catch{persistent=false}};const badge=(x,kind='')=>`<span class="pill ${kind}">${x}</span>`;const btn=(t,js,cls='')=>`<button class="${cls}" onclick="${js}">${t}</button>`;function notify(t){clearTimeout(toastTimer);document.getElementById('toast').className='toast';document.getElementById('toast').textContent=t;toastTimer=setTimeout(()=>{document.getElementById('toast').textContent='';document.getElementById('toast').className=''},4500)}function go(page){state.page=page;save();render();window.scrollTo(0,0);document.getElementById('page-title')?.focus()}function hero(k,h,p){return `<section class="hero"><div class="eyebrow">${k}</div><h1 id="page-title" tabindex="-1">${h}</h1><p>${p}</p></section>`}function update(k,v){state[k]=v;state.planned=false;consent=false;save()}function startMail(){state.step=1;state.tab='mail';go('acquisition')}function openContent(type='Newsletter'){state.contentType=type;go('editor')}function nextStep(n){if(n>1&&!selected().length)return notify('Wähle mindestens einen Kontakt.');if(n>2&&(!state.subject.trim()||!state.body.trim()))return notify('Bitte Betreff und Nachricht ergänzen.');if(n>3&&!ready().length)return notify('Für diese Auswahl fehlen noch Angaben.');state.step=n;consent=false;save();render();document.getElementById('page-title')?.focus();window.scrollTo(0,0)}function selectContact(id,on){state.selected=on?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);state.planned=false;consent=false;save();render()}function startTask(){state.task=document.getElementById('task').value;save();const q=state.task.toLowerCase();if(/kontakt|akquise|kunden gewinnen/.test(q)){state.tab='find';go('acquisition')}else if(/mail/.test(q)&&!/newsletter/.test(q)){startMail()}else if(/newsletter/.test(q)){openContent('Newsletter')}else if(/bild|foto/.test(q)){openContent('Bild')}else if(/video|film/.test(q)){openContent('Video')}else{openContent('Social Post')}}
function home(){return hero('DEIN MARKETING. EIN ORT.','Weniger organisieren.<br><span>Mehr erreichen.</span>','Starte eine Aufgabe oder arbeite dort weiter, wo du aufgehört hast.')+`<section class="panel"><h2>Was möchtest du heute erledigen?</h2><label class="hidden" for="task">Deine Aufgabe</label><div class="taskbox"><input id="task" aria-label="Deine Aufgabe" placeholder="Zum Beispiel: Neue Kunden in der Region Solothurn gewinnen" value="${esc(state.task)}">${btn('Aufgabe starten ↗','startTask()','primary')}</div><div class="chips">${btn('Neue Kunden gewinnen',"state.tab='find';go('acquisition')")}${btn('Newsletter erstellen',"openContent('Newsletter')")}${btn('Social Post gestalten',"openContent('Social Post')")}</div></section><div class="grid"><section><div class="sectiontitle"><h2>Weiterarbeiten</h2><span class="muted">Dein letzter Stand</span></div><button class="card" onclick="startMail()"><div class="row">${badge('Akquise')}<span>↗</span></div><h3>Persönliche Ansprache · Region Solothurn</h3><p class="muted">${state.selected.length} Kontakte ausgewählt · Nachricht gespeichert</p><span class="saved">Auswahl und Text bleiben erhalten</span></button><button class="card" style="margin-top:14px" onclick="openContent('Newsletter')"><div class="row">${badge('Newsletter')}<span>↗</span></div><h3>${esc(state.contentTitle)}</h3><p class="muted">Entwurf · Weiter bei der Vorschau</p></button></section><section><div class="sectiontitle"><h2>Deine nächste Entscheidung</h2></div><div class="panel"><span class="pill warn">1 Angabe fehlt</span><h3 style="margin-top:18px">Ein Kontakt braucht noch Klärung.</h3><p class="muted">Die anderen drei können weiterbearbeitet werden.</p>${btn('Auswahl ansehen →','startMail()')}<div class="line"></div><p class="muted">Alles an einem Ort: Aufgabe, Inhalt und nächster Schritt.</p></div></section></div>`}
function contactTable(){return `<table class="table"><thead><tr><th>Auswahl</th><th>Kontakt / Unternehmen</th><th class="optional">Branche</th><th class="optional-mobile">Status</th></tr></thead><tbody>${contacts.map(c=>`<tr><td><label class="check"><input aria-label="${c.name} auswählen" type="checkbox" ${state.selected.includes(c.id)?'checked':''} onchange="selectContact(${c.id},this.checked)"></label></td><td><b>${c.name}</b><small>${c.firm}</small></td><td class="optional">${c.industry}</td><td class="optional-mobile">${badge(c.ok?'Angaben vollständig':'Angabe fehlt',c.ok?'ok':'warn')}</td></tr>`).join('')}</tbody></table>`}
function acquisition(){let tabs=`<div class="tabs" aria-label="Akquise-Bereiche">${[['find','Kontakte finden'],['contacts','Kontakte'],['mail','Mails']].map(([v,t])=>btn(t,`state.tab='${v}';render()`,state.tab===v?'active':'')).join('')}</div>`;let h=hero('AKQUISE','Aus Kontakten werden <span>Gespräche.</span>','Finden, auswählen, persönlich anschreiben. Ein zusammenhängender Ablauf.');if(state.tab==='find')return h+tabs+`<section class="panel"><h2>Wen möchtest du erreichen?</h2><label for="research">Dein Suchwunsch</label><textarea id="research">${esc(state.task||'Industriebetriebe in der Region Solothurn mit einer Ansprechperson fürs Marketing.')}</textarea><p class="muted">Vorschau: Recherche und Quellenprüfung werden später angebunden.</p>${btn('Beispielergebnisse ansehen →',"state.tab='contacts';save();render()",'primary')}</section>`;if(state.tab==='contacts')return h+tabs+`<section class="panel"><div class="row"><h2>Deine Kontakte</h2>${badge('4 Beispiele')}</div><p class="muted">Einmal auswählen. Die Auswahl begleitet dich bis zur Versandprüfung.</p>${contactTable()}</section><div class="footerbar"><span><b>${selected().length} Kontakte</b> ausgewählt</span><button class="primary" ${selected().length?'':'disabled'} onclick="startMail()">Mail erstellen →</button></div>`;return h+tabs+mail()}
function steps(){return `<div class="steps" aria-label="Fortschritt">${['Empfänger','Nachricht','Vorschau','Bestätigen'].map((s,i)=>`${i?'<span class="connector"></span>':''}<span class="step ${state.step===i+1?'active':''}" ${state.step===i+1?'aria-current="step"':''}><b>${i+1}</b>${s}</span>`).join('')}</div>`}
function mail(){let content='';if(state.step===1){content=`<section class="panel"><div class="row"><h2>Wem möchtest du schreiben?</h2>${badge(selected().length+' ausgewählt')}</div>${contactTable()}${selected().some(c=>!c.ok)?`<div class="notice"><b>Bei Jan Muster fehlt die Versandgrundlage.</b><br>Du kannst den Kontakt abwählen und mit den übrigen weiterarbeiten.</div>`:''}</section>`}if(state.step===2){content=`<section class="panel"><div class="row"><h2>Deine Nachricht</h2><span class="saved">${persistent?'Lokal gespeichert':'Speicherung nicht verfügbar'}</span></div><p class="muted">Für ${selected().length} ausgewählte Kontakte. In dieser Vorschau bearbeitest du einen gemeinsamen Beispieltext.</p><label for="subject">Betreff</label><input id="subject" value="${esc(state.subject)}" oninput="update('subject',this.value)"><label for="body" style="margin-top:20px">Nachricht</label><textarea id="body" style="min-height:240px" oninput="update('body',this.value)">${esc(state.body)}</textarea><details><summary>Bilder und Links ergänzen</summary><p class="muted">Für die nächste Ausbaustufe vorgesehen: Medien aus deiner Bibliothek direkt einfügen.</p></details></section>`}if(state.step===3){content=`<div class="grid"><section class="paper"><div class="eyebrow">BEISPIELVORSCHAU</div><div class="subject">${esc(state.subject)}</div><p>${esc(state.body)}</p><span class="muted">Signatur wird später aus dem Firmenprofil übernommen.</span></section><section class="panel"><h2>Deine Auswahl ist geprüft.</h2><div class="line"><b>${ready().length} Kontakte</b><p class="muted">Vollständige Angaben im Beispieldatensatz.</p></div>${selected().some(c=>!c.ok)?`<div class="notice"><b>1 Kontakt bleibt zurückgestellt.</b><br>Jan Muster: Versandgrundlage fehlt.</div>${btn('Nur vollständige Kontakte übernehmen',"state.selected=ready().map(c=>c.id);state.planned=false;consent=false;save();render()")}`:'<p class="saved">Keine offenen Angaben in dieser Auswahl.</p>'}<p class="muted">Eine Änderung am Text hebt eine spätere Bestätigung wieder auf.</p></section></div>`}if(state.step===4){content=`<section class="panel"><h2>${state.planned?'Beispielplanung gespeichert.':'Alles bereit für deine Entscheidung.'}</h2><p><b>${ready().length} Mails</b> · ${esc(state.subject)}</p><p class="muted">Versand zur nächsten erlaubten Versandzeit. In dieser Vorschau wird ausschliesslich eine lokale Planung simuliert.</p>${state.planned?'<span class="pill ok">Simulation abgeschlossen · keine Mail versendet</span>':`<label class="check"><input id="consent" type="checkbox" onchange="consent=this.checked;document.getElementById('plan').disabled=!consent">Ich habe Empfänger und Nachricht in dieser Vorschau geprüft.</label>`}</section>`}const next=state.step<4?`<button class="primary" ${state.step===1&&!selected().length?'disabled':''} onclick="nextStep(${state.step+1})">${['','Nachricht schreiben','Vorschau ansehen','Weiter zur Bestätigung'][state.step]} →</button>`:state.planned?btn('Zur Übersicht',"go('home')",'primary'):`<button id="plan" class="primary" disabled onclick="plan()">Planung simulieren →</button>`;return steps()+content+`<div class="footerbar">${state.step>1?btn('← Zurück',`nextStep(${state.step-1})`,'quiet'):`<span class="muted">${selected().length} ausgewählt · ${ready().length} vollständig</span>`}${next}</div>`}
function plan(){if(!consent||!ready().length)return;state.planned=true;save();render();notify('Beispielplanung gespeichert. Es wurde nichts versendet.')}function content(){return hero('INHALTE','Eine Idee. <span>Viele Möglichkeiten.</span>','Wähle, was du erstellen möchtest. Deinen Entwurf findest du immer hier wieder.')+`<div class="cards">${[['Social Post','Für LinkedIn, Instagram und Facebook','↗'],['Newsletter','Mit deiner bewährten Vorlage','✉'],['Bild','Ein neues Motiv oder eine Bearbeitung','▧'],['Video','Idee, Ablauf und Vorschau','▷'],['Website','Inhalte einer Seite überarbeiten','▤']].map(([t,p,i])=>`<button class="card" onclick="openContent('${t}')"><span style="font-size:26px">${i}</span><h3>${t}</h3><p class="muted">${p}</p></button>`).join('')}</div><div class="sectiontitle"><h2>Deine Entwürfe</h2></div><button class="card" onclick="openContent('Newsletter')"><div class="row"><span><b>${esc(state.contentTitle)}</b><p class="muted">Newsletter · Im gleichen Editor weiterarbeiten</p></span><span>→</span></div></button>`}
function editor(){const kind=state.contentType;return hero(kind.toUpperCase(),'Deine Idee wird <span>sichtbar.</span>','Bearbeiten und Vorschau gehören zusammen. Dein Entwurf bleibt erhalten.')+`<div class="row" style="margin-bottom:18px">${btn('← Alle Inhalte',"go('content')",'quiet')}<span class="saved">${persistent?'Lokal gespeichert':'Speicherung nicht verfügbar'}</span></div><div class="editor"><section class="panel"><h2>Inhalt bearbeiten</h2><p class="muted">${kind==='Newsletter'?'Vorlage: Studiojeker · Beispielaufbau':'Ein gemeinsamer Ablauf für alle Formate.'}</p><label for="headline">Headline</label><input id="headline" value="${esc(state.contentTitle)}" oninput="editContent('contentTitle',this.value)"><label for="copy">Text</label><textarea id="copy" oninput="editContent('contentText',this.value)">${esc(state.contentText)}</textarea><p class="muted">Änderungen erscheinen direkt rechts in der Vorschau.</p>${btn('Letzte Änderung rückgängig','undo()')}<details><summary>Weitere Möglichkeiten</summary><p class="muted">Bildauswahl, KI-Änderungswünsche und kanalabhängige Exporte folgen nach der Gestaltungsfreigabe.</p></details></section><section><div class="row" style="margin-bottom:12px"><b>Vorschau</b>${badge('Entwurf')}</div><article class="paper" style="padding:0;overflow:hidden"><div class="art"><span>STUDIOJEKER · BEISPIELINHALT</span><strong id="preview-title">${esc(state.contentTitle)}</strong><span>CREATING VISIBILITY</span></div><div style="padding:28px"><h2 id="preview-subtitle">${esc(state.contentTitle)}</h2><p id="preview-text">${esc(state.contentText)}</p><p class="muted">${kind==='Video'?'Storyboard-Vorschau · noch kein gerenderter Film':kind==='Bild'?'Layout-Vorschau · noch kein generiertes Bild':'Diese Vorschau zeigt den V2-Bedienablauf, nicht die endgültige Newsletter- oder Website-Vorlage.'}</p></div></article></section></div>`}
function editContent(k,v){previousContent={title:state.contentTitle,text:state.contentText};update(k,v);document.getElementById('preview-title').textContent=state.contentTitle;document.getElementById('preview-subtitle').textContent=state.contentTitle;document.getElementById('preview-text').textContent=state.contentText}function undo(){if(!previousContent)return notify('Noch keine Änderung zum Rückgängigmachen.');state.contentTitle=previousContent.title;state.contentText=previousContent.text;previousContent=null;save();render()}
function projects(){return hero('PROJEKTE','Alles, was <span>zusammengehört.</span>','Ziel, Inhalte und Termine in einem Projekt. Für einzelne Aufgaben optional.')+`<section class="panel"><div class="row"><h2>Beispielprojekt · Sichtbarkeit</h2>${badge('In Arbeit')}</div><p class="muted">Ziel: Regelmässig mit passenden Inhalten präsent sein.</p><div class="line row"><span><b>Konzept</b><br><span class="muted">Zielgruppe, Botschaft und Kanäle</span></span>${btn('Ansehen',"notify('Beispielkonzept: regionale KMU; regelmässige Sichtbarkeit; Newsletter und Social Media.')")}</div><div class="line row"><span><b>Newsletter</b><br><span class="muted">${esc(state.contentTitle)}</span></span>${btn('Weiterarbeiten',"openContent('Newsletter')")}</div><div class="line row"><span><b>Persönliche Ansprache</b><br><span class="muted">${selected().length} ausgewählte Kontakte</span></span>${btn('Öffnen','startMail()')}</div></section>`}
function library(){return hero('BIBLIOTHEK','Schnell finden. <span>Direkt verwenden.</span>','Ordner nach Kunden oder Projekten. Eine Suche für deine Inhalte.')+`<div class="toolbar"><input aria-label="Bibliothek durchsuchen" placeholder="Beispiele durchsuchen …" oninput="document.querySelectorAll('[data-asset]').forEach(e=>e.hidden=!e.dataset.asset.includes(this.value.toLowerCase()))"><button disabled title="In diesem Prototyp noch nicht angebunden">Hochladen · folgt</button></div><div class="subtitle">Bibliothek / Studiojeker / Sichtbarkeit · Beispielmedien</div><div class="cards">${['Markenmotiv','Newsletter-Vorlage','Videokonzept'].map((a,i)=>`<button class="card" data-asset="${a.toLowerCase()}" onclick="openContent('${['Bild','Newsletter','Video'][i]}')"><div class="thumb">${['ONE','Aa','▷'][i]}</div><h3>${a}</h3><p class="muted">Im Editor öffnen →</p></button>`).join('')}</div>`}
function calendar(){return hero('KALENDER','Deine Woche. <span>Im Überblick.</span>','Geplantes und offene Entwürfe an einem Ort.')+`<section class="panel"><div class="row"><h2>Beispielwoche</h2>${badge('Planung')}</div><div class="calendaritem"><strong>MI</strong><div><b>Newsletter · ${esc(state.contentTitle)}</b><p class="muted">Entwurf · Noch kein Versandtermin bestätigt</p></div>${btn('Bearbeiten',"openContent('Newsletter')")}</div><div class="calendaritem"><strong>DO</strong><div><b>Persönliche Ansprache</b><p class="muted">${state.planned?'Lokal simuliert · kein Versand':'Noch nicht eingeplant'}</p></div>${btn('Ansehen',"state.step=4;state.tab='mail';go('acquisition')")}</div><p class="muted">Apple-, Google- und Microsoft-Kalender sind im Prototyp nicht verbunden.</p></section>`}
function settings(){return hero('EINSTELLUNGEN','Einmal einrichten.<br><span>Einfach weiterarbeiten.</span>','Firma, Marke und Verbindungen werden künftig hier gebündelt.')+`<section class="panel"><h2>Vorschau-Modus</h2><p>Alle Kontakte und Inhalte sind Beispieldaten. Es gibt keine Verbindung zu V1, Mailchimp, SMTP oder anderen Konten.</p><p>Dieser Prototyp speichert Änderungen nur in diesem Browser. Keine Passwörter oder echten Kundendaten eingeben.</p>${btn('Beispieldaten zurücksetzen',"if(confirm('Lokale Beispieldaten zurücksetzen?')){state={...initial,selected:[1,2,3,4]};save();go('home')}")}</section>`}
function render(){document.getElementById('nav').innerHTML=names.map(([v,t,i])=>`<button ${state.page===v||(v==='content'&&state.page==='editor')?'aria-current="page"':''} onclick="go('${v}')"><span class="navicon" aria-hidden="true">${i}</span>${t}</button>`).join('');document.getElementById('crumb').textContent=names.find(x=>x[0]===state.page)?.[1]|| (state.page==='editor'?'Inhalte / '+state.contentType:'Einstellungen');document.getElementById('app').innerHTML=({home,acquisition,content,editor,projects,library,calendar,settings}[state.page]||home)()}
render();
</script></body></html>
