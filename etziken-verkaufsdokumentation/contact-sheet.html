<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontaktübersicht · Originalfotos Etziken</title>
    <style>
      @font-face {
        font-family: "Inter Local";
        src: url("fonts/Inter-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter Local";
        src: url("fonts/Inter-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      :root {
        --green: #25483e;
        --anthracite: #242a27;
        --warm-white: #faf9f6;
        --sand: #eae4d9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter Local", system-ui, sans-serif;
        background: var(--warm-white);
        color: var(--anthracite);
      }
      header {
        padding: 28px 32px 16px;
        border-bottom: 1px solid var(--sand);
      }
      header .badge {
        display: inline-block;
        margin-bottom: 10px;
        padding: 4px 10px;
        background: var(--sand);
        color: var(--green);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.45;
        color: #4a524e;
        max-width: 62ch;
      }
      a { color: var(--green); }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 24px 32px 48px;
      }
      figure {
        margin: 0;
        background: var(--sand);
        padding: 12px;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        background: #ddd8ce;
      }
      figcaption {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.45;
        word-break: break-all;
      }
      figcaption .role {
        display: block;
        margin-bottom: 4px;
        color: var(--green);
        font-weight: 600;
        word-break: normal;
      }
      figcaption .meta {
        color: #6a736e;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="badge">Kontrolldokument · Nicht Teil der Broschüre</span>
      <h1>Kontaktübersicht — alle Originaldateien</h1>
      <p>
        Vollständige, unveränderte Darstellung aller gelieferten Fotos mit
        Dateiname. Dient der Kontrolle. Gehört nicht in die Verkaufsbroschüre.
      </p>
      <p><a href="brochure.html">← Zurück zum Layoutentwurf</a></p>
    </header>
    <div class="grid" id="sheet"></div>
    <script>
      async function run() {
        const [manifest, brochure] = await Promise.all([
          fetch("content/image-manifest.json").then((r) => r.json()),
          fetch("content/brochure.json").then((r) => r.json()),
        ]);
        const roles = {
          [brochure.image_assignment.title_page]: "Titelseite (Garten)",
          [brochure.image_assignment.interior_page]: "Innenseite (Wohnen & Essen)",
        };
        const sheet = document.getElementById("sheet");
        sheet.innerHTML = manifest.images
          .map((img) => {
            const role = roles[img.filename]
              ? `<span class="role">${roles[img.filename]}</span>`
              : "";
            return `
              <figure>
                <img
                  src="assets/approved/${encodeURIComponent(img.filename)}"
                  alt="${img.filename}"
                  width="${img.width_px}"
                  height="${img.height_px}"
                />
                <figcaption>
                  ${role}
                  <strong>${img.filename}</strong><br />
                  <span class="meta">${img.width_px} × ${img.height_px} px · SHA-256 ${img.sha256.slice(0, 16)}…</span>
                </figcaption>
              </figure>`;
          })
          .join("");
        await Promise.all(
          [...sheet.querySelectorAll("img")].map(
            (img) =>
              new Promise((resolve, reject) => {
                if (img.complete && img.naturalWidth) resolve();
                else {
                  img.onload = () => resolve();
                  img.onerror = () => reject(new Error(img.src));
                }
              })
          )
        );
        document.documentElement.dataset.ready = "true";
      }
      run().catch((e) => {
        document.getElementById("sheet").textContent = e.message;
      });
    </script>
  </body>
</html>
