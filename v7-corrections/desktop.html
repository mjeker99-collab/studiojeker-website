uter Content allein reicht nicht. Er muss gesehen werden.&lt;/p&gt;&lt;p style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;margin:0 0 0px 0;&quot;&gt;Deshalb verstehen wir uns als Visibility Partner unserer Kunden – von der ersten Idee über die Content-Produktion bis zur Distribution und laufenden Betreuung.&lt;/p&gt;&lt;/div&gt;&lt;p mc:edit=&quot;intro_claim&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;font-weight:700;margin:14px 0 0 0;&quot;&gt;WE CREATE VISIBILITY.&lt;/p&gt;&lt;div mc:edit=&quot;intro_cta&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;margin:4px 0 0 0;&quot;&gt;&lt;a class=&quot;sj-cta&quot; href=&quot;https://www.studiojeker.ch/&quot; target=&quot;_blank&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;font-weight:700;color:#000000;text-decoration:none;display:inline-block;padding:12px 0;&quot;&gt;→ Das neue Studiojeker entdecken&lt;/a&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;sj-bleed&quot; style=&quot;padding:28px 0 0 0;background-color:#ffffff;&quot;&gt;&lt;table role=&quot;presentation&quot; border=&quot;0&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; width=&quot;100%&quot; style=&quot;width:100%;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;&quot; &gt;&lt;tr&gt;&lt;td class=&quot;sj-ai-inner&quot; style=&quot;padding:22px 24px;&quot;&gt;&lt;table role=&quot;presentation&quot; border=&quot;0&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; width=&quot;100%&quot; style=&quot;width:100%;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;&quot; &gt;&lt;tr&gt;&lt;td class=&quot;sj-stack sj-ai-photo&quot; width=&quot;48%&quot; valign=&quot;top&quot; style=&quot;width:48%;vertical-align:top;padding:0 22px 0 0;&quot;&gt;&lt;img mc:edit=&quot;ai_image&quot; src=&quot;https://cdn.sanity.io/images/tgx6e6jg/production/64a906ed2ca0239a6f72f34846a8c16d3178fc6a-1344x752.png&quot; width=&quot;300&quot; height=&quot;168&quot; alt=&quot;Content Creation × AI – Motorradfahrer&quot; style=&quot;display:block;width:100%;height:auto;border:0;outline:none;-ms-interpolation-mode:bicubic;&quot; /&gt;&lt;/td&gt;&lt;td class=&quot;sj-stack sj-ai-text&quot; width=&quot;52%&quot; valign=&quot;top&quot; style=&quot;width:52%;vertical-align:top;padding:0;&quot;&gt;&lt;div mc:edit=&quot;ai_eyebrow&quot; class=&quot;sj-eyebrow&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:12.65px;font-weight:700;color:#6b6f74;margin:0 0 12px 0;&quot;&gt;CONTENT CREATION × AI&lt;/div&gt;&lt;h2 class=&quot;sj-heading&quot; mc:edit=&quot;ai_headline&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:27.6px;font-weight:700;color:#000000;margin:0 0 14px 0;&quot;&gt;Neue Möglichkeiten. Gleicher Anspruch an Qualität.&lt;/h2&gt;&lt;div class=&quot;sj-copy&quot; mc:edit=&quot;ai_body_start&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;&quot;&gt;&lt;p style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;margin:0 0 0px 0;&quot;&gt;Künstliche Intelligenz verändert die Möglichkeiten der Content-Produktion fundamental. Wir haben deshalb KI konsequent in unsere Produktionsprozesse integriert.&lt;/p&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;div class=&quot;sj-ai-continuation sj-copy&quot; mc:edit=&quot;ai_body_continuation&quot; style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;padding-top:14px;&quot;&gt;&lt;p style=&quot;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21.75px;font-weight:400;color:#000000;margin:0 0 12px 0;&quot;
